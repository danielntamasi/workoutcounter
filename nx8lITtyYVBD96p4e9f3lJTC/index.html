<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Counter · 6x6 E video test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2126; --tile: #262e35; --ink: #eceae4; --muted: #8a949c;
    --fill: #f2c230; --fill-ink: #1b2126; --done: #5fbf7a; --warn: #e5553c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#eceae4; --tile:#dcd9d0; --ink:#1b2126; --muted:#5d666d; --done:#3f9d5a; }
  }
  :root[data-theme="light"] { --bg:#eceae4; --tile:#dcd9d0; --ink:#1b2126; --muted:#5d666d; --done:#3f9d5a; }
  :root[data-theme="dark"] { --bg:#1b2126; --tile:#262e35; --ink:#eceae4; --muted:#8a949c; --done:#5fbf7a; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--fill); outline-offset: -3px; }
  .screen { display: none; max-width: 560px; margin: 0 auto; padding: 16px; min-height: 100%; flex-direction: column; gap: 14px; }
  .screen.active { display: flex; }

  /* Home */
  .home-title { font-size: 30px; font-weight: 700; margin: 4px 0 0; }
  #home.screen { gap: 8px; }
  .pick {
    flex: 1; border: 0; border-radius: 18px; background: var(--tile); text-align: left;
    padding: 10px 16px; display: flex; flex-direction: column; justify-content: flex-start; gap: 2px; min-height: 0;
  }
  .pick:active { transform: scale(.98); }
  .pick-name { font-size: 30px; font-weight: 800; line-height: 1; }
  .pick-desc { font-size: 18px; font-weight: 500; color: var(--muted); }
  .pick-status { font-size: 20px; font-weight: 700; color: var(--done); }
  .pick-status:empty { display: none; }
  .pgroup { flex: 1.3; border-radius: 18px; background: var(--tile); padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  .pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; flex: 1; }
  .ptile { border: 0; border-radius: 12px; background: var(--bg); text-align: left; padding: 8px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ptile:active { transform: scale(.97); }
  .ptile b { font-size: 26px; white-space: nowrap; font-weight: 800; line-height: 1; }
  .ptile span { font-size: 14px; white-space: nowrap; font-weight: 500; color: var(--muted); }
  .ptile em { font-style: normal; font-size: 14px; font-weight: 700; color: var(--done); min-height: 19px; }

  /* Shared bar */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ghost { background: none; border: 2px solid var(--tile); border-radius: 10px; padding: 8px 14px; font-size: 18px; font-weight: 700; color: var(--muted); }
  .clockrow { display: flex; align-items: center; gap: 12px; background: var(--tile); border-radius: 16px; padding: 10px 12px 10px 16px; }
  .clock { flex: 1; font-size: 48px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 20px; font-weight: 500; color: var(--muted); display: block; margin-top: 2px; }
  .go { border: 0; border-radius: 12px; background: var(--fill); color: var(--fill-ink); font-size: 22px; font-weight: 800; padding: 14px 20px; min-width: 96px; }
  .go.running { background: var(--ink); color: var(--bg); }
  .go:disabled { background: var(--done); color: var(--fill-ink); cursor: default; }

  /* 400 */
  .total { font-size: 26px; font-weight: 700; }
  .total span { color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; }
  .tile { position: relative; overflow: hidden; border-radius: 18px; background: var(--tile); min-height: 180px; display: flex; flex-direction: column; }
  .level { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--fill); transition: height .25s ease-out; }
  .tile.done .level { background: var(--done); }
  .add { position: relative; flex: 1; border: 0; background: none; text-align: left; padding: 14px 14px 8px; display: flex; flex-direction: column; justify-content: space-between; }
  .add:active { transform: scale(.98); }
  .name { font-size: 22px; font-weight: 700; line-height: 1.05; }
  .count { font-size: 72px; font-weight: 800; line-height: .85; font-variant-numeric: tabular-nums; }
  .hint { font-size: 17px; font-weight: 500; opacity: .75; }
  .tile.over .add, .tile.over .undo { color: var(--fill-ink); }
  .undo { position: relative; border: 0; background: rgba(0,0,0,.18); font-size: 18px; font-weight: 700; padding: 10px; }
  .undo:disabled { opacity: .35; cursor: default; }
  .finish { text-align: center; font-size: 26px; font-weight: 700; color: var(--done); min-height: 32px; }

  /* Plus one */
  .ring-wrap { position: relative; width: min(72vw, 300px); aspect-ratio: 1; margin: 4px auto 0; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { stroke: var(--tile); }
  .ring-fg { stroke: var(--fill); transition: stroke-dashoffset .2s linear; }
  .ring-fg.hot { stroke: var(--warn); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .secs { font-size: 96px; font-weight: 800; line-height: .9; font-variant-numeric: tabular-nums; }
  .round { font-size: 24px; font-weight: 600; color: var(--muted); }
  .bump {
    flex: 1; min-height: 160px; border: 0; border-radius: 22px; background: var(--fill); color: var(--fill-ink);
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
  }
  .bump:active { transform: scale(.98); }
  .bump .big { font-size: 110px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .bump .lbl { font-size: 34px; font-weight: 800; }
  .row2 { display: flex; gap: 12px; }
  .row2 .ghost { flex: 1; padding: 14px; font-size: 20px; }

  /* 12 Rounds */
  .bigclock { font-size: 84px; font-weight: 800; line-height: .9; text-align: center; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .lapnow { text-align: center; font-size: 24px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pips { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
  .pip { height: 10px; border-radius: 5px; background: var(--tile); }
  .pip.on { background: var(--fill); }
  .pip.done { background: var(--done); }
  #r12.screen { height: 100%; min-height: 0; }
  .laps { flex: 1 1 0; min-height: 0; overflow-y: auto; background: var(--tile); border-radius: 16px; padding: 6px 14px; }
  .lap { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: baseline; font-size: 22px; font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--bg); font-variant-numeric: tabular-nums; }
  .lap:last-child { border-bottom: 0; }
  .lap b { text-align: center; } .lap .cum { color: var(--muted); font-weight: 500; text-align: right; }
  .lap.fast b { color: var(--done); } .lap.slow b { color: var(--warn); }
  .laps .empty { color: var(--muted); font-size: 20px; padding: 10px 0; }
  .bump.r12 { flex: 0 0 auto; min-height: 130px; }
  .celebrate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--fill); color: var(--fill-ink); text-align: center; padding: 24px; }
  .celebrate.show { display: flex; }
  .celebrate h2 { margin: 0; font-size: 64px; font-weight: 800; line-height: .95; }
  .celebrate .ctime { font-size: 72px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .celebrate p { margin: 0; font-size: 22px; font-weight: 600; opacity: .8; }
  .celebrate button { margin-top: 16px; background: var(--fill-ink); color: var(--fill); }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 11; }
  /* PHAT-30 */
  .phase-lbl { text-align: center; font-size: 22px; font-weight: 600; color: var(--muted); }
  .exname { text-align: center; font-size: 40px; font-weight: 800; line-height: 1; }
  .exsteps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .exsteps div { height: 10px; border-radius: 5px; background: var(--tile); }
  .exsteps .on { background: var(--fill); } .exsteps .cur { background: var(--ink); }
  .work { font-size: 150px; font-weight: 800; line-height: .9; text-align: center; font-variant-numeric: tabular-nums; }
  .work.hot { color: var(--warn); }
  .work.pre { color: var(--muted); }
  video.demo { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 14px; margin-top: 4px; }
  #phBody:has(video.demo) { gap: 8px !important; }
  .repline { text-align: center; font-size: 48px; font-weight: 800; line-height: 1; } .repline small { font-size: 22px; font-weight: 700; color: var(--muted); }
  .work.sm { font-size: 96px; }
  .repbig { text-align: center; font-size: 120px; font-weight: 800; line-height: .9; font-variant-numeric: tabular-nums; }
  .repbig small { display: block; font-size: 26px; font-weight: 700; color: var(--muted); margin-top: 6px; }
  .hrow.f3 { grid-template-columns: .8fr 1fr 1fr; } .hrow.f3 span:not(:first-child) { text-align: right; }
  .cue { text-align: center; font-size: 26px; font-weight: 700; min-height: 30px; }
  .cue.pre { color: var(--warn); }
  .card { background: var(--tile); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .card label { font-size: 20px; font-weight: 600; color: var(--muted); }
  .numin { font: inherit; font-size: 44px; font-weight: 800; width: 100%; text-align: center; background: var(--bg); color: var(--ink);
    border: 2px solid var(--bg); border-radius: 12px; padding: 6px; font-variant-numeric: tabular-nums; }
  .numin:focus { outline: none; border-color: var(--fill); }
  .steprow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .steprow button { border: 0; border-radius: 12px; background: var(--bg); font-size: 24px; font-weight: 800; padding: 12px 0; }
  .bigbtn { white-space: nowrap; border: 0; border-radius: 20px; background: var(--fill); color: var(--fill-ink); font-size: 36px; font-weight: 800; padding: 26px; }
  .bigbtn:active { transform: scale(.98); }
  .bigbtn:disabled { opacity: .45; cursor: default; transform: none; }
  .bigbtn.alt { background: var(--tile); color: var(--ink); font-size: 24px; padding: 14px; }
  .bigbtn.confirm { background: var(--warn); color: #fff; font-size: 20px !important; white-space: normal; }
  .stat { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; font-size: 22px; font-weight: 600; }
  .stat b { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ok { color: var(--done); } .bad { color: var(--warn); }
  .hist { background: var(--tile); border-radius: 16px; padding: 6px 14px; overflow-y: auto; min-height: 0; flex: 1 1 0; }
  .hrow { display: grid; grid-template-columns: .7fr 1fr 1fr 1fr; font-size: 20px; font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--bg); font-variant-numeric: tabular-nums; }
  .hrow.h { color: var(--muted); font-weight: 500; font-size: 17px; }
  .hrow span:not(:first-child) { text-align: right; }
  /* PHAT screens scroll as a page; tables take their natural height; action buttons stay pinned at the bottom */
  #phat.screen, #phHist.screen, #ic.screen, #ic4.screen, #abs.screen { height: auto; min-height: 100%; }
  #abBody .hist { flex: 0 0 auto; overflow: visible; }
  .abpips { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .abpips div { height: 12px; border-radius: 4px; background: var(--tile); }
  .abpips .on { background: var(--done); } .abpips .cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  #c4Body .hist { flex: 0 0 auto; overflow: visible; }
  .c4pips { display: grid; grid-template-columns: repeat(19, 1fr); gap: 3px; }
  .c4pips div { height: 12px; border-radius: 3px; background: var(--tile); }
  .c4pips .rest { background: transparent; border: 2px dashed var(--tile); }
  .c4pips .on { background: var(--done); } .c4pips .rest.on { background: transparent; border-color: var(--done); }
  .c4pips .cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  .c4grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .c4grid label { display: flex; flex-direction: column; gap: 4px; font-size: 17px; font-weight: 600; color: var(--muted); }
  .c4grid .numin { font-size: 30px; padding: 6px; background: var(--tile); border-color: var(--tile); }
  .hrow.c46 { grid-template-columns: .6fr repeat(4, 1fr) .8fr; }
  .hrow.c46 span:not(:first-child) { text-align: right; }
  .ptile span { overflow: hidden; text-overflow: ellipsis; }
  .ptile em:empty { display: none; }
  .ptile { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 6px; row-gap: 2px; align-content: flex-start; }
  .ptile b { font-size: 24px; } .ptile span { min-width: 0; }
  .ptile em { flex-basis: 100%; }
  .pgrid { margin-top: 6px; }
  #icBody .hist { flex: 0 0 auto; overflow: visible; }
  .icpips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .icpips div { height: 12px; border-radius: 4px; background: var(--tile); }
  .icpips .b { background: var(--fill); } .icpips .j { background: var(--done); }
  .icpips .x { background: var(--warn); } .icpips .cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  .icrest { text-align: center; font-size: 30px; font-weight: 800; color: var(--done); min-height: 36px; font-variant-numeric: tabular-nums; }
  .hrow.ic3 { grid-template-columns: .7fr 1fr 1fr; }
  .hrow.ic3 span:not(:first-child) { text-align: right; }
  .miss { color: var(--warn); }
  #phBody .hist, #histBody .hist { flex: 0 0 auto; overflow: visible; }
  .actbar { position: sticky; bottom: 0; z-index: 5; background: var(--bg);
    margin: 0 -16px -16px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .phase-lbl.small { font-size: 17px; }
  .card.tight { gap: 4px; padding: 10px 16px; } .card.tight .stat b { font-size: 26px; }
  .hrow.tap, .sess.tap, .breakdown { cursor: pointer; }
  .hrow.tap:active, .sess.tap:active { opacity: .6; }
  .hrow.h7 { grid-template-columns: .8fr repeat(6, 1fr) 1fr .9fr; gap: 2px; font-size: 17px; }
  .hrow.h.h7 { font-size: 13px; }
  .hrow.h7 span { text-align: right; }
  .breakdown { display: grid; grid-template-columns: repeat(6, 1fr) auto; gap: 4px; align-items: end; background: var(--bg); border-radius: 10px; padding: 6px 8px;
    font-size: 22px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  .breakdown.static { grid-template-columns: repeat(6, 1fr); background: var(--tile); cursor: default; }
  .breakdown small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .breakdown em { font-style: normal; color: var(--muted); font-size: 18px; }
  .sheet { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
  .sheet.show { display: flex; }
  .sheet-card { width: 100%; max-width: 560px; background: var(--bg); border-radius: 22px 22px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
  .sheet-title { font-size: 26px; font-weight: 800; }
  .edrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 20px; font-weight: 600; }
  .numin.sm { font-size: 28px; width: 96px; padding: 4px; background: var(--tile); border-color: var(--tile); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .barcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 2px; min-width: 0; }
  .barcol b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .barcol small { font-size: 12px; color: var(--muted); }
  .bfill { width: 100%; max-width: 34px; background: var(--fill); border-radius: 5px 5px 0 0; min-height: 4px; }
  .sess { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--bg); }
  .sess b { font-size: 22px; } .sess small { display: block; font-size: 16px; color: var(--muted); font-weight: 500; }
  .sess-avg { text-align: right; } .sess-avg b { font-size: 30px; font-variant-numeric: tabular-nums; }
  .sess-stats { display: flex; gap: 16px; } .sess-stats .sess-avg:first-child b { font-size: 24px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .level, .ring-fg { transition: none; } .add:active, .bump:active, .pick:active { transform: none; } }
</style>
</head>
<body>

<!-- Home -->
<section class="screen active" id="home">
  <div class="home-title">Pick a workout</div>
  <button class="pick" data-go="c400">
    <span class="pick-name">400 Challenge</span>
    <span class="pick-desc">100 each × 4 exercises · stopwatch</span>
    <span class="pick-status" id="st400"></span>
  </button>
  <button class="pick" data-go="plus">
    <span class="pick-name">Plus One</span>
    <span class="pick-desc">+1 per round · 1-min timer</span>
    <span class="pick-status" id="stPlus"></span>
  </button>
  <div class="pgroup">
    <div class="pick-name">PHAT-30</div>
    <div class="pgrid">
      <button class="ptile" data-variant="A"><b>A</b><span>DB</span><em id="stPhatA"></em></button>
      <button class="ptile" data-variant="B"><b>B</b><span>Cable</span><em id="stPhatB"></em></button>
      <button class="ptile" data-variant="C"><b>C</b><span>DB</span><em id="stPhatC"></em></button>
      <button class="ptile" data-variant="D"><b>D</b><span>Mixed</span><em id="stPhatD"></em></button>
      <button class="ptile" data-variant="BW"><b>BW A</b><span>Body</span><em id="stPhatBW"></em></button>
      <button class="ptile" data-variant="BWB"><b>BW B</b><span>Body</span><em id="stPhatBWB"></em></button>
      <button class="ptile" data-variant="E"><b>E</b><span>6×6</span><em id="stPhatE"></em></button>
    </div>
  </div>
  <div class="pgroup" style="flex:1">
    <div class="pick-name">Cardio &amp; Core</div>
    <div class="pgrid" style="grid-template-columns:repeat(5,minmax(0,1fr))">
      <button class="ptile" data-icv="A"><b>3A</b><span>20m</span><em id="stIcA"></em></button>
      <button class="ptile" data-icv="B"><b>3B</b><span>20m</span><em id="stIcB"></em></button>
      <button class="ptile" data-c4v="A"><b>4A</b><span>19m</span><em id="stIc4A"></em></button>
      <button class="ptile" data-c4v="B"><b>4B</b><span>29m</span><em id="stIc4B"></em></button>
      <button class="ptile" data-go="abs"><b>Abs</b><span>8m</span><em id="stAbs"></em></button>
    </div>
  </div>
  <button class="pick" data-go="r12">
    <span class="pick-name">12 Rounds</span>
    <span class="pick-desc">Stopwatch · lap per round</span>
    <span class="pick-status" id="st12"></span>
  </button>
</section>

<!-- 400 Challenge -->
<section class="screen" id="c400">
  <div class="bar">
    <button class="ghost" data-back>Back</button>
    <div class="total"><b id="total">0</b> <span>/ 400</span></div>
    <button class="ghost" id="reset400">Reset</button>
  </div>
  <div class="clockrow">
    <div class="clock" id="sw">0:00</div>
    <button class="go" id="swBtn">Start</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="finish" id="finish" aria-live="polite"></div>
</section>

<!-- Plus One -->
<section class="screen" id="plus">
  <div class="bar">
    <button class="ghost" data-back>Back</button>
    <button class="ghost" id="resetPlus">Reset</button>
  </div>
  <div class="ring-wrap">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring-bg" cx="60" cy="60" r="54" fill="none" stroke-width="10"/>
      <circle class="ring-fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="10" stroke-linecap="round"/>
    </svg>
    <div class="ring-center">
      <div class="secs" id="secs">60</div>
      <div class="round" id="round">Round 1</div>
    </div>
  </div>
  <div class="row2">
    <button class="go" id="minBtn" style="flex:1">Start</button>
  </div>
  <button class="bump" id="bump" aria-label="Add 1">
    <span class="lbl">+1</span>
    <span class="big" id="plusCount">0</span>
  </button>
  <div class="row2">
    <button class="ghost" id="minus">−1</button>
    <button class="ghost" id="elapsed" disabled>0:00 total</button>
  </div>

<canvas id="confetti"></canvas>

<script>
  const today = new Date().toDateString();
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); if (v && v.date === today) return v; } catch (e) {} return d; };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const fmt = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
  const buzz = p => { if (navigator.vibrate) navigator.vibrate(p); };

  // Timer primitive: accumulated ms + optional running start timestamp
  const elapsedOf = t => t.acc + (t.startedAt ? Date.now() - t.startedAt : 0);
  const startT = t => { if (!t.startedAt) t.startedAt = Date.now(); };
  const pauseT = t => { if (t.startedAt) { t.acc += Date.now() - t.startedAt; t.startedAt = null; } };

  // Audio (unlocked on first Start tap)
  let ctx;
  function unlockAudio() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {} }
  function beep(freq, dur) {
    if (!ctx) return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = "square"; g.gain.value = 0.15;
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
    } catch (e) {}
  }

  // Keep screen awake while a timer runs (where supported)
  let lock = null;
  async function wake(on) {
    try {
      if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); }
      if (!on && lock) { await lock.release(); lock = null; }
    } catch (e) {}
  }

  // Reset needs a second tap within 3s (native confirm dialogs are blocked here)
  function armReset(id, fn) {
    const b = document.getElementById(id); let armed = null;
    b.addEventListener("click", () => {
      if (armed) { clearTimeout(armed); armed = null; b.textContent = "Reset"; b.style.color = ""; fn(); return; }
      b.textContent = "Tap again"; b.style.color = "var(--warn)";
      armed = setTimeout(() => { armed = null; b.textContent = "Reset"; b.style.color = ""; }, 3000);
    });
  }

  /* ---------- Navigation ---------- */
  const screens = document.querySelectorAll(".screen");
  function show(id) { screens.forEach(s => s.classList.toggle("active", s.id === id)); try { localStorage.setItem("wkScreen", id); } catch (e) {} renderAll(); }
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));
  document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => show("home")));

  /* ---------- 400 Challenge ---------- */
  const EX = ["Pushups", "Inverted rows", "Bodyweight squats", "Full sit-ups"];
  const GOAL = 100, STEP = 5;
  let c4 = load("ax400v2", { date: today, counts: [0,0,0,0], sw: { acc: 0, startedAt: null } });
  const save4 = () => store("ax400v2", c4);
  const total4 = () => c4.counts.reduce((a, b) => a + b, 0);

  const grid = document.getElementById("grid");
  const tiles = EX.map((name, i) => {
    const el = document.createElement("div");
    el.className = "tile";
    el.innerHTML = `<div class="level"></div>
      <button class="add" aria-label="Add 5 ${name}"><span class="name">${name}</span>
        <span><span class="count">0</span><br><span class="hint"></span></span></button>
      <button class="undo" aria-label="Remove 5 ${name}">−5</button>`;
    el.querySelector(".add").addEventListener("click", () => change4(i, STEP));
    el.querySelector(".undo").addEventListener("click", () => change4(i, -STEP));
    grid.appendChild(el);
    return el;
  });

  function change4(i, d) {
    const next = Math.min(GOAL, Math.max(0, c4.counts[i] + d));
    if (next === c4.counts[i]) return;
    c4.counts[i] = next;
    if (d > 0 && !c4.sw.startedAt && total4() === STEP) { unlockAudio(); startT(c4.sw); wake(true); } // auto-start on first tap
    if (total4() === 400) { pauseT(c4.sw); wake(false); buzz([60, 80, 60, 80, 200]); }
    else buzz(next === GOAL ? [40, 60, 40] : 15);
    save4(); render400();
  }

  document.getElementById("swBtn").addEventListener("click", () => {
    unlockAudio();
    if (c4.sw.startedAt) { pauseT(c4.sw); wake(false); } else { startT(c4.sw); wake(true); }
    save4(); render400();
  });
  armReset("reset400", () => {
    c4 = { date: today, counts: [0,0,0,0], sw: { acc: 0, startedAt: null } };
    wake(false); save4(); render400();
  });

  function render400() {
    tiles.forEach((el, i) => {
      const c = c4.counts[i];
      el.querySelector(".level").style.height = (c / GOAL * 100) + "%";
      el.querySelector(".count").textContent = c;
      el.querySelector(".hint").textContent = c >= GOAL ? "Done" : `${GOAL - c} left`;
      el.querySelector(".undo").disabled = c === 0;
      el.querySelector(".add").disabled = c >= GOAL;
      el.classList.toggle("done", c >= GOAL);
      el.classList.toggle("over", c >= 45);
    });
    const t = total4();
    document.getElementById("total").textContent = t;
    document.getElementById("sw").textContent = fmt(elapsedOf(c4.sw));
    const b = document.getElementById("swBtn");
    b.textContent = t === 400 ? "Done" : c4.sw.startedAt ? "Pause" : (c4.sw.acc ? "Resume" : "Start");
    b.disabled = t === 400;
    b.classList.toggle("running", !!c4.sw.startedAt);
    document.getElementById("finish").textContent = t === 400 ? `400 done in ${fmt(elapsedOf(c4.sw))}.` : "";
  }

  /* ---------- Plus One ---------- */
  // t = total workout time, r = time in the current round (restarts on every +1)
  const freshP = () => ({ date: today, count: 0, t: { acc: 0, startedAt: null }, r: { acc: 0, startedAt: null } });
  let p1 = load("plusOneV2", freshP());
  const saveP = () => store("plusOneV2", p1);
  const ring = document.getElementById("ring");
  const CIRC = 2 * Math.PI * 54;
  ring.style.strokeDasharray = CIRC;
  let lastLeft = null, overBeeped = false;

  function runP(on) {
    if (on) { startT(p1.t); startT(p1.r); wake(true); } else { pauseT(p1.t); pauseT(p1.r); wake(false); }
  }
  document.getElementById("minBtn").addEventListener("click", () => {
    unlockAudio(); runP(!p1.t.startedAt); saveP(); renderPlus();
  });
  document.getElementById("bump").addEventListener("click", () => {
    unlockAudio();
    p1.count++;
    p1.r = { acc: 0, startedAt: null };   // new minute starts now
    runP(true);
    lastLeft = null; overBeeped = false;
    buzz(15); saveP(); renderPlus();
  });
  document.getElementById("minus").addEventListener("click", () => { if (p1.count > 0) { p1.count--; saveP(); renderPlus(); } });
  armReset("resetPlus", () => { p1 = freshP(); lastLeft = null; overBeeped = false; wake(false); saveP(); renderPlus(); });

  function renderPlus() {
    const rms = elapsedOf(p1.r);
    const over = rms >= 60000;
    const left = Math.ceil((60000 - rms) / 1000);
    document.getElementById("secs").textContent = over ? "+" + Math.floor((rms - 60000) / 1000) : (rms === 0 ? 60 : left);
    document.getElementById("round").textContent = over ? "Time's up · tap +1" : "Round " + (p1.count + 1);
    ring.style.strokeDashoffset = over ? CIRC : CIRC * (rms / 60000);
    ring.classList.toggle("hot", !!p1.r.startedAt && (over || left <= 5));
    document.getElementById("plusCount").textContent = p1.count;
    document.getElementById("elapsed").textContent = fmt(elapsedOf(p1.t)) + " total";
    const b = document.getElementById("minBtn");
    b.textContent = p1.t.startedAt ? "Pause" : (p1.t.acc ? "Resume" : "Start");
    b.classList.toggle("running", !!p1.t.startedAt);

    if (p1.r.startedAt) {
      if (over && !overBeeped) { beep(1320, 0.5); buzz([200, 80, 200]); overBeeped = true; }
      else if (!over && lastLeft !== null && left !== lastLeft && left <= 3) beep(880, 0.12);
    }
    lastLeft = left;
  }

  /* ---------- 12 Rounds ---------- */
  const ROUNDS = 12;
  const fmtT = ms => { const t = Math.floor(ms / 100), m = Math.floor(t / 600), sec = Math.floor(t / 10) % 60;
    return m + ":" + String(sec).padStart(2, "0") + "." + (t % 10); };
  const fresh12 = () => ({ date: today, t: { acc: 0, startedAt: null }, splits: [], done: false });
  let r12 = load("rounds12", fresh12());
  const save12 = () => store("rounds12", r12);
  const pipsEl = document.getElementById("pips");
  for (let i = 0; i < ROUNDS; i++) { const d = document.createElement("div"); d.className = "pip"; pipsEl.appendChild(d); }
  const lapTimes = () => r12.splits.map((c, i) => c - (i ? r12.splits[i - 1] : 0));

  document.getElementById("r12Bump").addEventListener("click", () => {
    unlockAudio();
    if (r12.done) return;
    if (!r12.t.startedAt && r12.t.acc === 0) {              // first tap = start
      startT(r12.t); wake(true); buzz(15);
    } else {
      if (!r12.t.startedAt) startT(r12.t);                   // tapping while paused resumes and logs
      r12.splits.push(elapsedOf(r12.t));
      buzz(15); beep(990, 0.08);
      if (r12.splits.length >= ROUNDS) finish12();
    }
    save12(); render12();
  });
  document.getElementById("r12Pause").addEventListener("click", () => {
    if (r12.done || (!r12.t.startedAt && r12.t.acc === 0)) return;
    if (r12.t.startedAt) { pauseT(r12.t); wake(false); } else { startT(r12.t); wake(true); }
    save12(); render12();
  });
  document.getElementById("r12Undo").addEventListener("click", () => {
    if (!r12.splits.length) return;
    r12.splits.pop();
    if (r12.done) { r12.done = false; }                      // reopen; clock stays paused until you resume
    save12(); render12();
  });
  armReset("reset12", () => { r12 = fresh12(); wake(false); hideCelebrate(); save12(); render12(); });

  function finish12() {
    r12.splits[ROUNDS - 1] = elapsedOf(r12.t);
    pauseT(r12.t); r12.t.acc = r12.splits[ROUNDS - 1];
    r12.done = true; wake(false);
    buzz([80, 60, 80, 60, 300]);
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, i === 3 ? 0.5 : 0.15), i * 160));
    showCelebrate(true);
  }

  function showCelebrate(withConfetti) {
    const laps = lapTimes(), total = r12.splits[ROUNDS - 1];
    document.getElementById("cTime").textContent = fmtT(total);
    const fast = Math.min(...laps), avg = total / ROUNDS;
    document.getElementById("cStats").textContent = `Avg round ${fmtT(avg)} · Fastest ${fmtT(fast)} (R${laps.indexOf(fast) + 1})`;
    document.getElementById("celebrate").classList.add("show");
    if (withConfetti) confetti();
  }
  function hideCelebrate() { document.getElementById("celebrate").classList.remove("show"); }
  document.getElementById("cClose").addEventListener("click", hideCelebrate);

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.getElementById("confetti"), g = cv.getContext("2d");
    const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
    const cols = ["#1b2126", "#3f9d5a", "#e5553c", "#ffffff", "#2f7fc1"];
    const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .5, vx: (Math.random() - .5) * 6, vy: 4 + Math.random() * 7,
      s: (6 + Math.random() * 8) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
    const t0 = performance.now();
    (function frame(now) {
      g.clearRect(0, 0, W, H);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .12; p.r += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
      if (now - t0 < 4000) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H);
    })(t0);
  }

  let lapsKey = "";
  function render12() {
    const ms = elapsedOf(r12.t), n = r12.splits.length, last = n ? r12.splits[n - 1] : 0;
    const notStarted = !r12.t.startedAt && r12.t.acc === 0;
    document.getElementById("r12Clock").textContent = fmtT(ms);
    document.getElementById("r12Lap").textContent = r12.done ? "Finished" :
      notStarted ? `Round 1 of ${ROUNDS}` : `Round ${n + 1} of ${ROUNDS} · ${fmtT(ms - last)}`;
    document.getElementById("r12Count").textContent = n;
    document.getElementById("r12Lbl").textContent = r12.done ? "Done" : notStarted ? "Start" : "+1";
    document.getElementById("r12Bump").disabled = r12.done;
    const pb = document.getElementById("r12Pause");
    pb.textContent = r12.t.startedAt ? "Pause" : "Resume";
    pb.style.visibility = (notStarted || r12.done) ? "hidden" : "visible";
    document.getElementById("r12Undo").disabled = n === 0;
    [...pipsEl.children].forEach((d, i) => { d.className = "pip" + (i < n ? (r12.done ? " done" : " on") : ""); });

    const key = r12.splits.join(",");
    if (key !== lapsKey) {
      lapsKey = key;
      const laps = lapTimes(), el = document.getElementById("laps");
      if (!n) { el.innerHTML = '<div class="empty">Round times show up here.</div>'; return; }
      const fast = Math.min(...laps), slow = Math.max(...laps);
      el.innerHTML = laps.map((l, i) => {
        const cls = n > 1 && l === fast ? "fast" : n > 1 && l === slow ? "slow" : "";
        return `<div class="lap ${cls}"><span>R${i + 1}</span><b>${fmtT(l)}</b><span class="cum">${fmtT(r12.splits[i])}</span></div>`;
      }).reverse().join("");
    }
  }
  if (r12.done) showCelebrate(false);

  /* ---------- PHAT-30 (A and B share one engine) ---------- */
  const PHV = {
    A: { name: "PHAT-30 A", key: "phat30a", kind: "phatA", perEx: false,
         ex: ["DB bench press", "Alt. reverse goblet lunges", "DB T-bar rows", "DB RDLs", "DB clean up & overs", "Swipers"],
         short: ["Bench", "Lunge", "Row", "RDL", "Clean", "Swipe"],
         wtLabel: "Dumbbell weight (lb) · your ~15RM, used for all exercises" },
    B: { name: "PHAT-30 B", key: "phat30b", kind: "phatB", perEx: true,
         ex: ["Cable overhead triceps ext.", "Low pulley goblet squats", "Cable curls", "Cable pull throughs", "Cable around the world rows", "Kneeling cable crunches"],
         short: ["Tri", "Squat", "Curl", "PullT", "AtW", "Crunch"],
         wtLabel: "Starting pin (lb) · ~15RM on the first exercise",
         note: "Set the pin for each exercise on its GO screen. Loads are saved and pre-filled next time. Aim for 4–5 rounds." },
    C: { name: "PHAT-30 C", key: "phat30c", kind: "phatC", perEx: false,
         ex: ["DB push press", "DB jump squats", "DB waiter curls", "DB swings", "DB cleans", "Sit-up elbow thrusts"],
         short: ["Press", "Jump", "Curl", "Swing", "Clean", "Situp"],
         wtLabel: "Dumbbell weight (lb) · your ~15RM, used for all exercises",
         note: "Same weight for all five DB moves; sit-up elbow thrusts are bodyweight. Aim for 4–5 rounds." },
    D: { name: "PHAT-30 D", key: "phat30d", kind: "phatD", perEx: true,
         ex: ["X-crossovers", "Alternating reverse DB lunges", "Straight arm pushdowns", "DB alt. reverse sprinter lunge", "Pivot pushaways", "Cable core death march"],
         short: ["XOver", "Lunge", "SAPush", "Sprint", "Pivot", "March"],
         wtLabel: "Starting load (lb) · ~15RM on the first exercise",
         note: "15RM on each exercise: cables for the upper-body and core moves, dumbbells for the lunges. Set the load on each GO screen — it's saved and pre-filled next time. Aim for 4–5 rounds." },
    BW: { name: "PHAT-BW A", key: "phat30bwa", kind: "phatBWA", perEx: false, bw: true,
         ex: ["Diamond cutter push-ups", "Static creeping lunges", "Chin-ups", "Hip buck marches", "Burpees", "Bicycle crunches"],
         short: ["Push", "Lunge", "Chin", "Hip", "Burpee", "Bike"],
         note: "Bodyweight only. Aim for 4–5 rounds. The program retests this one in 2 weeks — History shows the comparison." },
    BWB: { name: "PHAT-BW B", key: "phat30bwb", kind: "phatBWB", perEx: false, bw: true,
         ex: ["Cobra push-ups", "Bodyweight squats", "Pull-ups", "Long leg marches", "Brock shuffle", "Power ups"],
         short: ["Cobra", "Squat", "Pullup", "March", "Brock", "PwrUp"],
         note: "Bodyweight only. Aim for 4–5 rounds. The program retests this one in 2 weeks — History shows the comparison." },
    E: { name: "PHAT-6x6 E", key: "phat6x6e", kind: "phat6x6E", perEx: false, fixed: true, rounds: 6,
         ex: ["Barbell bench press", "DB Bulgarian split squats", "DB rows", "Leaning Bulgarian split squats", "DB man makers", "Scissor kicks"],
         short: ["Bench", "BSS", "Row", "LBSS", "ManMk", "Sciss"],
         videos: ["https://portal.athleanx.com/workout-exer-videos/mp4/Barbell%20Bench%20Press.mp4", "https://portal.athleanx.com/workout-exer-videos/mp4/DB%20Bulgarian%20Split%20Squats.mp4", "https://portal.athleanx.com/workout-exer-videos/mp4/DB%20Rows.mp4", "https://portal.athleanx.com/workout-exer-videos/mp4/Leaning%20Bulgarian%20Split%20Squats.mp4", "https://portal.athleanx.com/workout-exer-videos/mp4/DB%20Man%20Makers.mp4", "https://portal.athleanx.com/workout-exer-videos/mp4/Scissor%20Kicks.mp4"],
         reps: [6, 6, 6, 6, 6, null], eachLeg: [false, true, false, true, false, false], useBB: [true, false, false, false, false, false],
         wtLabel: "Dumbbell pair (lb) · your Bulgarian split squat 8RM, used for every DB move",
         note: "6 rounds of 6 reps (6 each leg on the split squats), scissor kicks for 30s. Tap Done after each set. Goal next time: lower average heart rate." }
  };
  let phV = "A";
  try { if (PHV[localStorage.getItem("phVariant")]) phV = localStorage.getItem("phVariant"); } catch (e) {}
  let V = PHV[phV], PH_EX = V.ex, PH_SHORT = V.short;
  const WORK = 30000, PREP = 3000;
  const freshPh = () => ({ date: today, phase: "setup", rhr: null, wt: null, loads: [], start: null, end: null, ex: 0, workStart: null,
    cur: [], rounds: [], recStart: null, hrAfter: null, id: null });
  function loadPh(v) { const st = load(PHV[v].key, freshPh()); if (st.start && !st.id) st.id = PHV[v].kind + "-" + st.start; if (!st.loads) st.loads = []; return st; }
  let ph = loadPh(phV);
  const savePh = () => store(V.key, ph);
  const phBody = document.getElementById("phBody");
  let phView = "", lastWorkLeft = null, lastPre = null, lastStep = "";
  const sumR = a => a.reduce((x, y) => x + (y || 0), 0);
  const rTot = r => r.reps ? sumR(r.reps) : (r.total || 0);
  const prevReps = i => { const r = ph.rounds[ph.rounds.length - 1]; return r ? r.reps[i] : 0; };
  const target = () => ph.rhr ? Math.round(ph.rhr * 1.1) : null;
  const avgR = s => s.rounds.length ? Math.round(sumR(s.rounds.map(rTot)) / s.rounds.length) : 0;
  const avgRec = s => { const v = s.rounds.map(r => r.rec).filter(x => x != null); return v.length ? v.reduce((p, q) => p + q, 0) / v.length : null; };
  const recTxt = s => avgRec(s) != null ? fmt(avgRec(s)) : "–";
  const esc = v => v == null ? "–" : v;
  const loadRange = s => { const l = (s.loads || []).filter(x => x != null); if (!l.length) return `${esc(s.wt)} lb`;
    const lo = Math.min(...l), hi = Math.max(...l); return lo === hi ? `${lo} lb` : `${lo}–${hi} lb`; };
  const curLoad = () => ph.loads[ph.ex] ?? ph.loads[ph.ex - 1] ?? ph.wt;
  const loadLbl = () => V.bw ? "Load" : V.perEx || V.fixed ? "Loads" : "Weight";
  const loadTxt = x => V.bw ? "Bodyweight" : V.fixed ? `BB ${esc(x.bb)} · DB ${esc(x.wt)} lb` : V.perEx ? loadRange(x) : esc(x.wt) + " lb";
  const avgHR = s => { const v = s.rounds.map(r => r.hr).filter(x => x != null); return v.length ? Math.round(v.reduce((p, q) => p + q, 0) / v.length) : null; };
  const exLoad = i => V.useBB && V.useBB[i] ? ph.bb : ph.wt;

  function setVariant(v) {
    phV = v; V = PHV[v]; PH_EX = V.ex; PH_SHORT = V.short; ph = loadPh(v);
    phView = ""; histOpen = null; lastPre = null; lastWorkLeft = null;
    try { localStorage.setItem("phVariant", v); } catch (e) {}
  }
  document.querySelectorAll("[data-variant]").forEach(b => b.addEventListener("click", () => { setVariant(b.dataset.variant); show("phat"); }));

  /* History: on this device (localStorage) + your Claude account (db) when available */
  const HKEY = "phatHistory";
  let hist = {};
  try { hist = JSON.parse(localStorage.getItem(HKEY)) || {}; } catch (e) {}
  const saveHistLocal = () => { try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch (e) {} };
  let hdb = null, syncState = "local", dbQ = Promise.resolve();
  const dbWrite = fn => { if (!hdb) return; dbQ = dbQ.then(fn).catch(() => { syncState = "error"; }); };
  function putSession(x) {
    x.updated = Date.now(); hist[x.id] = JSON.parse(JSON.stringify(x)); saveHistLocal();
    const body = hist[x.id]; dbWrite(() => hdb.doc(x.id).set(body));
  }
  function dropSession(id) { delete hist[id]; saveHistLocal(); dbWrite(() => hdb.doc(id).delete()); }
  const archiveLive = () => { if (ph.phase !== "done" || !ph.id) return;
    putSession({ id: ph.id, kind: V.kind, wt: ph.wt, bb: V.fixed ? ph.bb : undefined, loads: V.perEx ? ph.loads : null, rhr: ph.rhr, start: ph.start, end: ph.end, rounds: ph.rounds }); };
  const lastSession = kind => Object.values(hist).filter(x => x.kind === kind).sort((p, q) => q.start - p.start)[0];
  for (const v of Object.keys(PHV)) {        // finished sessions still in this device's storage, from any day
    let st = null; try { st = JSON.parse(localStorage.getItem(PHV[v].key)); } catch (e) {}
    if (!st || st.phase !== "done" || !st.start || !st.rounds || !st.rounds.length) continue;
    const id = st.id || PHV[v].kind + "-" + st.start;
    if (!hist[id]) putSession({ id, kind: PHV[v].kind, wt: st.wt, bb: PHV[v].fixed ? st.bb : undefined, loads: PHV[v].perEx ? (st.loads || null) : null, rhr: st.rhr, start: st.start, end: st.end, rounds: st.rounds });
  }
  /* Oct 14 PHAT-30 A, entered from the workout-done screenshot. R1 corrected 74 → 85 (a mis-tap before Prev existed). */
  const OCT14_START = Date.parse("2026-10-14T11:32:00-07:00");
  const OCT14 = { id: "phatA-import-20261014", kind: "phatA", wt: 40, rhr: 75, start: OCT14_START, end: OCT14_START + 1772000, imported: true,
    rounds: [{ reps: null, total: 85, hr: 81, rec: 64000 }, { reps: null, total: 85, hr: 79, rec: 79000 }, { reps: null, total: 88, hr: 78, rec: 79000 },
             { reps: null, total: 87, hr: 83, rec: 71000 }, { reps: null, total: 84, hr: null, rec: null }] };
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  function fixOct14() {
    const real = Object.values(hist).find(x => x.kind === "phatA" && x.id !== OCT14.id && sameDay(x.start, OCT14_START));
    if (real) {                                // the original per-exercise record survived: keep it, apply the R1 fix
      const r1 = real.rounds[0];
      if (r1 && rTot(r1) === 74 && !real.r1fixed) { real.rounds[0] = { reps: null, total: 85, hr: r1.hr, rec: r1.rec }; real.r1fixed = true; putSession(real); }
      if (hist[OCT14.id]) dropSession(OCT14.id);
      return;
    }
    let seeded = false; try { seeded = localStorage.getItem("oct14Imported") === "1"; } catch (e) {}
    if (!hist[OCT14.id] && !seeded) putSession(JSON.parse(JSON.stringify(OCT14)));
    try { localStorage.setItem("oct14Imported", "1"); } catch (e) {}
  }
  fixOct14();

  (async () => {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const col = db.collection("data/users/" + uid);
    const snap = await col.get();
    hdb = col; syncState = "synced";
    const remote = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && typeof v.kind === "string" && (v.kind.startsWith("phat") || v.kind.startsWith("ic") || v.kind === "abs8")) remote[d.id] = v; });
    for (const [id, v] of Object.entries(remote)) if (!hist[id] || (v.updated || 0) > (hist[id].updated || 0)) hist[id] = v;
    saveHistLocal();
    for (const [id, v] of Object.entries(hist)) if (!remote[id] || (v.updated || 0) > (remote[id].updated || 0)) dbWrite(() => col.doc(id).set(v));
    fixOct14();
    phView = ""; renderPh(); renderHist(); icView = ""; renderIc(); c4View = ""; renderC4(); abView = ""; renderAb();
  })().catch(() => { syncState = "local"; });

  function phSet(patch) { Object.assign(ph, patch); savePh(); phView = ""; renderPh(); }
  armReset("resetPh", () => { ph = freshPh(); wake(false); savePh(); phView = ""; renderPh(); });

  function stepper(id, val) {
    return `<input class="numin" id="${id}" type="number" inputmode="numeric" min="0" value="${val ?? ""}" placeholder="–">
      <div class="steprow">${[-5, -1, 1, 5].map(d => `<button data-step="${d}" data-for="${id}">${d > 0 ? "+" + d : "−" + -d}</button>`).join("")}</div>`;
  }
  const numOf = id => { const el = document.getElementById(id); if (!el) return null; const v = parseInt(el.value, 10); return isNaN(v) ? null : Math.max(0, v); };
  function roundsTable(x, editable) {
    if (!x.rounds.length) return "";
    if (V.fixed) return `<div class="hist"><div class="hrow h f3"><span>Rnd</span><span>HR</span><span>Recovery</span></div>` +
      x.rounds.map((r, i) => `<div class="hrow f3${editable ? " tap" : ""}" ${editable ? `data-edit="${i}"` : ""}><span>R${i + 1}${editable ? " ✎" : ""}</span><span>${esc(r.hr)}</span><span>${r.rec != null ? fmt(r.rec) : "–"}</span></div>`).reverse().join("") + `</div>`;
    return `<div class="hist"><div class="hrow h"><span>Rnd</span><span>Reps</span><span>HR</span><span>Recovery</span></div>` +
      x.rounds.map((r, i) => `<div class="hrow${editable ? " tap" : ""}" ${editable ? `data-edit="${i}"` : ""}><span>R${i + 1}${editable ? " ✎" : ""}</span><span>${rTot(r)}</span><span>${esc(r.hr)}</span><span>${r.rec != null ? fmt(r.rec) : "–"}</span></div>`).reverse().join("") + `</div>`;
  }
  const steps = () => `<div class="exsteps">${PH_EX.map((_, i) => `<div class="${i < ph.ex ? "on" : i === ph.ex ? "cur" : ""}"></div>`).join("")}</div>`;
  const loadTag = () => V.bw || V.fixed ? "" : V.perEx ? (curLoad() != null ? ` · ${curLoad()} lb` : "") : (ph.wt ? ` · ${ph.wt} lb` : "");

  /* In-mode back: one step at a time */
  let phPrev = function () {
    if (ph.phase === "reps") { const cur = ph.cur.slice(); const v = numOf("phReps"); if (v != null) cur[ph.ex] = v; ph.cur = cur; }
    if (ph.phase === "ready" && V.perEx) { const l = numOf("phLoad"); if (l != null) ph.loads[ph.ex] = l; }
    if (ph.phase === "work") return phSet({ phase: "ready", workStart: null });
    if (ph.phase === "recover") return phSet({ phase: V.fixed ? "ready" : "reps", ex: 5 });
    if (V.fixed && ph.phase === "ready" && ph.ex > 0) return phSet({ phase: "ready", ex: ph.ex - 1 });
    if ((ph.phase === "ready" || ph.phase === "reps") && ph.ex > 0) return phSet({ phase: "reps", ex: ph.ex - 1 });
    if (ph.rounds.length) {                       // back into the previous round's summary
      const rounds = ph.rounds.slice(), r = rounds.pop();
      return phSet({ rounds, cur: r.reps ? r.reps.slice() : [], hrAfter: r.hr, recStart: Date.now() - (r.rec || 0), phase: "recover", ex: 5 });
    }
    phSet({ phase: "setup" });
  };

  /* Edit sheet: fix any round's reps / HR */
  const sheet = document.getElementById("edSheet");
  function openEdit(title, reps, hr, onSave, total) {
    const totOnly = reps == null;
    sheet.innerHTML = `<div class="sheet-card"><div class="sheet-title">${title}</div>

      <div class="row2"><button class="bigbtn alt" id="edCancel" style="flex:1">Cancel</button><button class="bigbtn" id="edSave" style="flex:2;font-size:26px;padding:14px">Save</button></div></div>`;

  function wireEdits(x, commit) {

  /* Heart rate after a round: pre-filled at the go-again target (or last round's HR);

  const hrDefault = () => target() ?? (ph.rounds.length ? ph.rounds[ph.rounds.length - 1].hr : null);
  const hrLabel = () => ph.hrAfter != null ? "Heart rate now (bpm)"

    : "Heart rate now (bpm)";
  let hrArmed = null;
  function disarmHr() {

  }

  }

  function phToRecover() { const cur = ph.cur.slice(); cur[ph.ex] = 0; phSet({ cur, phase: "recover", recStart: ph.recStart || Date.now(), hrAfter: ph.hrAfter }); }

  function buildPh() {
    if (hrArmed) { clearTimeout(hrArmed.timer); hrArmed = null; }
    const n = ph.rounds.length + 1;
    const prevBtn = `<button class="bigbtn alt" id="phPrev" style="flex:1">‹ Prev</button>`;
    if (ph.phase === "setup") {
      if (V.fixed && !ph.start && ph.wt == null && ph.bb == null) { const last = lastSession(V.kind); if (last) { ph.wt = last.wt; ph.bb = last.bb; } }
      phBody.innerHTML = `<div class="exname" style="margin-top:8px">${V.name}</div>
        <div class="phase-lbl">${PH_EX.join(" · ")}</div>
        ${V.fixed ? `<div class="card"><label>Barbell bench (lb) · your 8RM</label>${stepper("phBB", ph.bb)}</div>` : ""}
        ${V.bw ? "" : `<div class="card"><label>${V.wtLabel}</label>${stepper("phWt", ph.wt)}</div>`}
        <div class="card"><label>Resting heart rate (bpm)</label>${stepper("phRhr", ph.rhr)}</div>

      document.getElementById("phGo").onclick = () => { unlockAudio(); wake(true);
        const st = ph.start || Date.now(), wt = numOf("phWt");

        if (V.perEx && !loads.some(x => x != null)) {           // pre-fill pins from the last session of this workout

    } else if (ph.phase === "ready" && V.fixed && V.reps[ph.ex] != null) {

      phBody.innerHTML = `<div class="phase-lbl">Round ${n} of ${V.rounds} · Exercise ${ph.ex + 1} of 6${ld != null ? ` · ${V.useBB[ph.ex] ? "BB" : "DB"} ${ld} lb` : ""}</div>${steps()}
        <div class="exname" style="margin-top:4px;font-size:30px">${PH_EX[ph.ex]}</div>

      document.getElementById("phDone").onclick = () => { unlockAudio(); buzz(30); beep(990, 0.08);
        const cur = ph.cur.slice(); cur[ph.ex] = V.reps[ph.ex]; phSet({ cur, ex: ph.ex + 1, phase: "ready" }); };
    } else if (ph.phase === "ready") {
      const loadCard = V.perEx ? `<div class="card"><label>Pin / load for this exercise (lb)</label>${stepper("phLoad", curLoad())}</div>` : "";
      phBody.innerHTML = `<div class="phase-lbl">Round ${n} · Exercise ${ph.ex + 1} of 6${V.perEx ? "" : loadTag()}</div>${steps()}

        <div class="phase-lbl">Transition — set up, then go</div>
        ${V.videos && V.videos[ph.ex] ? `<video class="demo" src="${V.videos[ph.ex]}" autoplay muted loop playsinline preload="auto"></video>` : ""}

      document.getElementById("phStop").onclick = () => V.fixed ? phToRecover() : phSet({ phase: "reps" });
    } else if (ph.phase === "reps") {

      document.getElementById("phSave").onclick = () => {

        <div class="card"><div class="stat"><span>Recovery</span><b id="phRec">0:00</b></div>
          ${target() ? `<div class="stat"><span>Go again at</span><b>≤ ${target()} bpm</b></div>` : ""}</div>
        <div class="card"><label id="phHrLbl">${hrLabel()}</label>${stepper("phHr", ph.hrAfter ?? hrDefault())}</div>
        ${roundsTable(ph, true)}
        <div class="row2">${prevBtn}${last ? `<button class="bigbtn" id="phEnd" style="flex:3;font-size:26px;padding:14px 6px">Finish workout</button>`
          : `<button class="bigbtn alt" id="phEnd" style="flex:1">Finish</button><button class="bigbtn" id="phNext" style="flex:2;font-size:24px;padding:14px 6px">Round ${n + 1}</button>`}</div>`;
      document.getElementById("phHr").addEventListener("change", () => {

      const tot = sumR(ph.cur), prev = ph.rounds.length ? rTot(ph.rounds[ph.rounds.length - 1]) : null;

          <div class="breakdown" id="phCurEdit">${PH_SHORT.map((x, i) => `<span><small>${x}</small>${esc(ph.cur[i])}</span>`).join("")}<em>✎</em></div>
          <div class="stat"><span>Recovery</span><b id="phRec">0:00</b></div>

          <button class="bigbtn" id="phNext" style="flex:2;font-size:24px;padding:14px 6px">Round ${n + 1}</button></div>`;
      document.getElementById("phHr").addEventListener("change", () => {
        ph.hrAfter = numOf("phHr"); savePh(); disarmHr();

      document.getElementById("phCurEdit").onclick = () => { const shown = numOf("phHr");
        openEdit(`Round ${n} (current)`, ph.cur, shown,
          (reps, hr) => { phSet({ cur: reps, hrAfter: ph.hrAfter == null && hr === shown ? null : hr }); }); };
      wireEdits(ph, () => { savePh(); phView = ""; renderPh(); });
      const close = () => ({ reps: ph.cur, hr: numOf("phHr"), rec: Date.now() - ph.recStart });
      document.getElementById("phNext").onclick = e => { unlockAudio(); if (!hrConfirmed(e.currentTarget)) return;
        phSet({ rounds: [...ph.rounds, close()], cur: [], ex: 0, phase: "ready", hrAfter: null, recStart: null }); };

      phBody.innerHTML = `<div class="exname" style="margin-top:4px">${V.name} done</div>
        <div class="card tight"><div class="stat"><span>${loadLbl()}</span><b>${loadTxt(ph)}</b></div>
          <div class="stat"><span>Resting HR</span><b>${esc(ph.rhr)}</b></div>
          ${V.fixed ? `<div class="stat"><span>Rounds</span><b>${ph.rounds.length} / ${V.rounds}</b></div>
          <div class="stat"><span>Avg heart rate after rounds</span><b>${esc(avgHR(ph))}</b></div>`
          : `<div class="stat"><span>Rounds · total reps</span><b>${ph.rounds.length} · ${sumR(all)}</b></div>
          <div class="stat"><span>Avg / best round</span><b>${avgR(ph)} · ${Math.max(...all)}</b></div>`}
          <div class="stat"><span>Avg recovery</span><b>${recTxt(ph)}</b></div>
          <div class="stat"><span>Time</span><b>${fmt(ph.end - ph.start)}</b></div></div>
        <div class="phase-lbl small">Tap a round to fix it. Saved to history.</div>
        ${roundsTable(ph, true)}
        <div class="row2"><button class="bigbtn alt" id="phResume" style="flex:1">‹ Reopen</button>
          <button class="bigbtn" id="phHistBtn" style="flex:2;font-size:26px;padding:14px">History</button></div>`;
      wireEdits(ph, () => { savePh(); archiveLive(); phView = ""; renderPh(); });
      document.getElementById("phHistBtn").onclick = () => show("phHist");
      document.getElementById("phResume").onclick = () => phPrev();
    }
    const pb = document.getElementById("phPrev"); if (pb) pb.onclick = phPrev;
    const lastRow = phBody.lastElementChild; if (lastRow && lastRow.classList.contains("row2")) lastRow.classList.add("actbar");
    phBody.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
      const el = document.getElementById(b.dataset.for);
      el.value = Math.max(0, (parseInt(el.value, 10) || 0) + parseInt(b.dataset.step, 10));
      el.dispatchEvent(new Event("change")); buzz(10);
    });
  }

  function renderPh() {
    const key = phV + ph.phase + ph.ex + ph.rounds.length;
    if (key !== phView) {
      phView = key; buildPh();
      const step = phV + ph.phase + ph.ex + ph.rounds.length;          // new step → back to top; same-step re-render keeps scroll
      if (step !== lastStep) { lastStep = step; if (document.getElementById("phat").classList.contains("active")) window.scrollTo(0, 0); }
    }
    document.getElementById("phTotal").textContent = ph.start ? fmt((ph.end || Date.now()) - ph.start) : "0:00";
    if (ph.phase === "work") {
      const now = Date.now(), el = document.getElementById("phWork"), cue = document.getElementById("phCue");
      if (now < ph.workStart) {                                   // 3-2-1 get-ready
        const pre = Math.ceil((ph.workStart - now) / 1000);
        el.textContent = pre; el.classList.add("pre"); el.classList.remove("hot");
        cue.textContent = "Get in position"; cue.classList.add("pre");
        if (pre !== lastPre) { beep(660, 0.12); buzz(40); lastPre = pre; }
        return;
      }
      if (lastPre !== null) { beep(1320, 0.3); buzz(150); lastPre = null; }
      el.classList.remove("pre"); cue.classList.remove("pre"); cue.textContent = "Go";
      const left = Math.ceil((WORK - (now - ph.workStart)) / 1000);
      if (left <= 0) { beep(1320, 0.5); buzz([200, 80, 200]); lastWorkLeft = null; if (V.fixed) phToRecover(); else phSet({ phase: "reps" }); return; }
      el.textContent = left; el.classList.toggle("hot", left <= 5);
      if (lastWorkLeft !== null && left !== lastWorkLeft && left <= 3) beep(880, 0.12);
      lastWorkLeft = left;
    }
    if (ph.phase === "recover") document.getElementById("phRec").textContent = fmt(Date.now() - ph.recStart);
  }
  // Reopening a finished session takes it out of "done"
  const _origPhPrev = phPrev;
  phPrev = function () { if (ph.phase === "done") { ph.end = null; } return _origPhPrev(); };

  /* ---------- PHAT history screen ---------- */
  const histBody = document.getElementById("histBody");
  let histOpen = null;
  const dstr = ms => new Date(ms).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  function renderHist() {
    if (!document.getElementById("phHist").classList.contains("active")) return;
    document.getElementById("phHistTitle").textContent = V.name.replace("PHAT-30 ", "PHAT ").replace("PHAT-BW ", "PHAT BW ").replace("PHAT-6x6 ", "6x6 ") + " history";
    const list = Object.values(hist).filter(s => s.kind === V.kind && s.rounds && s.rounds.length).sort((a, b) => b.start - a.start);
    const syncTxt = syncState === "synced" ? "Saved to your Claude account and this device" :
      syncState === "error" ? "Couldn't reach your Claude account — saved on this device" : "Saved on this device only";
    if (histOpen && hist[histOpen] && V.fixed) {
      const s = hist[histOpen];
      histBody.innerHTML = `<div class="exname" style="font-size:32px">${dstr(s.start)}</div>
        <div class="card tight"><div class="stat"><span>Loads · RHR</span><b>${loadTxt(s)} · ${esc(s.rhr)}</b></div>
          <div class="stat"><span>Rounds</span><b>${s.rounds.length} / ${V.rounds}</b></div>
          <div class="stat"><span>Avg heart rate after rounds</span><b>${esc(avgHR(s))}</b></div>
          <div class="stat"><span>Avg recovery</span><b>${recTxt(s)}</b></div>
          ${s.end ? `<div class="stat"><span>Time</span><b>${fmt(s.end - s.start)}</b></div>` : ""}</div>
        <div class="hist"><div class="hrow h f3"><span>Rnd</span><span>HR</span><span>Recovery</span></div>
          ${s.rounds.map((r, i) => `<div class="hrow f3 tap" data-hedit="${i}"><span>R${i + 1}</span><span>${esc(r.hr)}</span><span>${r.rec != null ? fmt(r.rec) : "–"}</span></div>`).join("")}</div>
        <div class="phase-lbl small">Tap a round to fix its heart rate.</div>
        <div class="row2"><button class="bigbtn alt" id="hBack" style="flex:2">‹ All sessions</button><button class="bigbtn alt" id="hDel" style="flex:1">Delete</button></div>`;
      histBody.querySelectorAll("[data-hedit]").forEach(row => row.onclick = () => {
        const i = +row.dataset.hedit, r = s.rounds[i];
        openEdit(`${dstr(s.start)} · Round ${i + 1}`, r.reps, r.hr, (reps, hr) => {
          r.hr = hr; putSession(s);
          if (ph.id === s.id) { ph.rounds = JSON.parse(JSON.stringify(s.rounds)); savePh(); phView = ""; }
          renderHist();
        }, r.total);
      });
      document.getElementById("hBack").onclick = () => { histOpen = null; renderHist(); window.scrollTo(0, 0); };
      histBody.lastElementChild.classList.add("actbar");
      let armed = null; const del = document.getElementById("hDel");
      del.onclick = () => { if (!armed) { del.textContent = "Tap again"; del.style.color = "var(--warn)"; armed = setTimeout(() => { armed = null; del.textContent = "Delete"; del.style.color = ""; }, 3000); return; }
        clearTimeout(armed); dropSession(s.id); histOpen = null; renderHist(); };
      return;
    }
    if (histOpen && hist[histOpen]) {
      const s = hist[histOpen], all = s.rounds.map(rTot);
      const rr = s.rounds.filter(r => r.reps), exAvg = rr.length ? PH_EX.map((_, i) => Math.round(sumR(rr.map(r => r.reps[i] || 0)) / rr.length)) : null;
      histBody.innerHTML = `<div class="exname" style="font-size:32px">${dstr(s.start)}</div>
        <div class="card tight"><div class="stat"><span>${loadLbl()} · RHR</span><b>${loadTxt(s)} · ${esc(s.rhr)}</b></div>
          <div class="stat"><span>Rounds · total reps</span><b>${s.rounds.length} · ${sumR(all)}</b></div>
          <div class="stat"><span>Avg / best round</span><b>${avgR(s)} · ${Math.max(...all)}</b></div>
          <div class="stat"><span>Avg recovery</span><b>${recTxt(s)}</b></div>
          ${s.end ? `<div class="stat"><span>Time</span><b>${fmt(s.end - s.start)}</b></div>` : ""}</div>
        ${exAvg ? `<div class="breakdown static">${PH_SHORT.map((x, i) => `<span><small>${x} avg</small>${exAvg[i]}</span>`).join("")}</div>` : `<div class="phase-lbl small">Entered from round totals — no per-exercise breakdown.</div>`}
        <div class="hist"><div class="hrow h h7"><span>Rnd</span>${PH_SHORT.map(x => `<span>${x}</span>`).join("")}<span>Σ</span><span>HR</span></div>
          ${V.perEx && s.loads ? `<div class="hrow h h7"><span>lb</span>${PH_EX.map((_, j) => `<span>${esc(s.loads[j])}</span>`).join("")}<span></span><span></span></div>` : ""}
          ${s.rounds.map((r, i) => `<div class="hrow h7 tap" data-hedit="${i}"><span>R${i + 1}</span>${PH_EX.map((_, j) => `<span>${esc(r.reps ? r.reps[j] : null)}</span>`).join("")}<span><b>${rTot(r)}</b></span><span>${esc(r.hr)}</span></div>`).join("")}</div>
        <div class="phase-lbl small">Tap a round to fix it.</div>
        <div class="row2"><button class="bigbtn alt" id="hBack" style="flex:2">‹ All sessions</button><button class="bigbtn alt" id="hDel" style="flex:1">Delete</button></div>`;
      histBody.querySelectorAll("[data-hedit]").forEach(row => row.onclick = () => {
        const i = +row.dataset.hedit, r = s.rounds[i];
        openEdit(`${dstr(s.start)} · Round ${i + 1}`, r.reps, r.hr, (reps, hr, tot) => {
          r.reps = reps; r.hr = hr; if (reps == null) r.total = tot; putSession(s);
          if (ph.id === s.id) { ph.rounds = JSON.parse(JSON.stringify(s.rounds)); savePh(); phView = ""; }
          renderHist();
        }, r.total);
      });
      document.getElementById("hBack").onclick = () => { histOpen = null; renderHist(); window.scrollTo(0, 0); };
      histBody.lastElementChild.classList.add("actbar");
      let armed = null; const del = document.getElementById("hDel");
      del.onclick = () => { if (!armed) { del.textContent = "Tap again"; del.style.color = "var(--warn)"; armed = setTimeout(() => { armed = null; del.textContent = "Delete"; del.style.color = ""; }, 3000); return; }
        clearTimeout(armed); dropSession(s.id); histOpen = null; renderHist(); };
      return;
    }
    if (!list.length) { histBody.innerHTML = `<div class="phase-lbl" style="margin-top:30px">No sessions yet. Finish a ${V.name} workout and it shows up here.</div><div class="phase-lbl small">${syncTxt}</div>`; return; }
    if (V.fixed) {
      const tr = list.slice(0, 12).reverse(), vals = tr.map(avgHR), mxh = Math.max(...vals.filter(v => v != null), 1);
      histBody.innerHTML = `<div class="card tight"><label>Avg heart rate after rounds (lower is better)</label>
          <div class="bars">${tr.map((s, k) => `<div class="barcol"><b>${esc(vals[k])}</b><div class="bfill" style="height:${vals[k] ? Math.round(vals[k] / mxh * 100) : 0}%"></div><small>${new Date(s.start).getMonth() + 1}/${new Date(s.start).getDate()}</small></div>`).join("")}</div></div>
        <div class="hist">${list.map(s => `<div class="sess tap" data-open="${s.id}"><div><b>${dstr(s.start)}</b><small>${loadTxt(s)} · ${s.rounds.length} rounds</small></div><div class="sess-stats"><div class="sess-avg"><b>${recTxt(s)}</b><small>recovery</small></div><div class="sess-avg"><b>${esc(avgHR(s))}</b><small>avg HR</small></div></div></div>`).join("")}</div>
        <div class="phase-lbl small">${syncTxt}</div>`;
      histBody.querySelectorAll("[data-open]").forEach(r => r.onclick = () => { histOpen = r.dataset.open; renderHist(); window.scrollTo(0, 0); });
      return;
    }
    const trend = list.slice(0, 12).reverse(), mx = Math.max(...trend.map(avgR), 1);
    histBody.innerHTML = `<div class="card tight"><label>Avg reps per round</label>
        <div class="bars">${trend.map(s => `<div class="barcol"><b>${avgR(s)}</b><div class="bfill" style="height:${Math.round(avgR(s) / mx * 100)}%"></div><small>${new Date(s.start).getMonth() + 1}/${new Date(s.start).getDate()}</small></div>`).join("")}</div></div>
      <div class="hist">${list.map(s => `<div class="sess tap" data-open="${s.id}"><div><b>${dstr(s.start)}</b><small>${loadTxt(s)} · ${s.rounds.length} rounds · ${sumR(s.rounds.map(rTot))} reps</small></div><div class="sess-stats"><div class="sess-avg"><b>${recTxt(s)}</b><small>recovery</small></div><div class="sess-avg"><b>${avgR(s)}</b><small>reps/rnd</small></div></div></div>`).join("")}</div>
      <div class="phase-lbl small">${syncTxt}</div>`;
    histBody.querySelectorAll("[data-open]").forEach(r => r.onclick = () => { histOpen = r.dataset.open; renderHist(); window.scrollTo(0, 0); });
  }

  /* ---------- Interval Cardio 3A (EMOM) ---------- */
  // EMOM: minute 1 = burpees, minute 2 = box jumps, alternating for 20 minutes (burpees are exercise 1 in the program).
  const ICV = {
    A: { name: "Interval Cardio 3A", key: "ic3a", kind: "ic3a", mins: 20,
         ex: [{ n: "Burpees", short: "Burpees", reps: 10 }, { n: "Box jumps", short: "Box jumps", reps: 12 }] },
    B: { name: "Interval Cardio 3B", key: "ic3b", kind: "ic3b", mins: 20,
         ex: [{ n: "Burpees", short: "Burpees", reps: 12 }, { n: "Box jumps", short: "Box jumps", reps: 14 }] }
  };
  let icV = "A";
  try { if (ICV[localStorage.getItem("icVariant")]) icV = localStorage.getItem("icVariant"); } catch (e) {}
  let IC = ICV[icV];
  const icFresh = () => ({ date: today, phase: "setup", start: null, end: null, splits: [], minsDone: 0, id: null });
  let ic = load(IC.key, icFresh());
  const saveIc = () => store(IC.key, ic);
  const icBody = document.getElementById("icBody");
  let icView = "", icOpen = null, icLastMin = null, icLastBeep = null;
  const secs = ms => ms == null ? null : Math.round(ms / 1000);
  const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((p, q) => p + q, 0) / v.length : null; };
  const icMin = () => Math.floor((Date.now() - ic.start) / 60000);
  const icStats = x => {
    const n = x.minsDone || 0, sp = Array.from({ length: n }, (_, i) => x.splits[i] ?? null);
    const b = sp.filter((_, i) => i % 2 === 0), j = sp.filter((_, i) => i % 2 === 1);
    return { n, done: sp.filter(v => v != null).length, bAvg: secs(mean(b)), jAvg: secs(mean(j)), sp };
  };
  for (const v of Object.keys(ICV)) { // finished sessions still in storage (any day) → history
    let st = null; try { st = JSON.parse(localStorage.getItem(ICV[v].key)); } catch (e) {}
    if (st && st.phase === "done" && st.id && !hist[st.id]) putSession({ id: st.id, kind: ICV[v].kind, start: st.start, end: st.end, splits: st.splits, minsDone: st.minsDone });
  }
  function setIcVariant(v) {
    icV = v; IC = ICV[v]; ic = load(IC.key, icFresh());
    icView = ""; icOpen = null; icLastMin = null; icLastBeep = null;
    try { localStorage.setItem("icVariant", v); } catch (e) {}
  }
  document.querySelectorAll("[data-icv]").forEach(b => b.addEventListener("click", () => { setIcVariant(b.dataset.icv); show("ic"); }));
  const icArchive = () => putSession({ id: ic.id, kind: IC.kind, start: ic.start, end: ic.end, splits: ic.splits, minsDone: ic.minsDone });
  function icSet(patch) { Object.assign(ic, patch); saveIc(); icView = ""; renderIc(); }
  armReset("resetIc", () => { ic = icFresh(); icOpen = null; wake(false); saveIc(); icView = ""; renderIc(); });

  function icFinish(early) {
    const m = Math.min(icMin(), IC.mins);
    const minsDone = early ? Math.min(IC.mins, ic.splits[m] != null ? m + 1 : m) : IC.mins;
    icSet({ phase: "done", end: early ? Date.now() : ic.start + IC.mins * 60000, minsDone });
    icArchive(); wake(false);
    buzz([80, 60, 80, 60, 300]); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, i === 3 ? 0.5 : 0.15), i * 160));
  }

  function icSummary(x, editable) {
    const st = icStats(x), rows = Math.ceil(st.n / 2);
    const cell = v => v == null ? `<span class="miss">✗</span>` : `<span>${secs(v)}s</span>`;
    return `<div class="card tight">
        <div class="stat"><span>Minutes completed</span><b>${st.done} / ${st.n}</b></div>
        <div class="stat"><span>Avg burpees (×${IC.ex[0].reps})</span><b>${st.bAvg != null ? st.bAvg + "s" : "–"}</b></div>
        <div class="stat"><span>Avg box jumps (×${IC.ex[1].reps})</span><b>${st.jAvg != null ? st.jAvg + "s" : "–"}</b></div>
        ${x.end ? `<div class="stat"><span>Time</span><b>${fmt(x.end - x.start)}</b></div>` : ""}</div>
      ${editable ? `<div class="phase-lbl small">Time to finish the reps each minute. Tap a row to fix it.</div>` : ""}
      <div class="hist"><div class="hrow h ic3"><span>Rnd</span><span>Burpees</span><span>Box jumps</span></div>
        ${Array.from({ length: rows }, (_, k) => `<div class="hrow ic3${editable ? " tap" : ""}" data-icedit="${k}"><span>R${k + 1}</span>${cell(st.sp[2 * k])}${2 * k + 1 < st.n ? cell(st.sp[2 * k + 1]) : "<span></span>"}</div>`).join("")}</div>`;
  }
  function icWireEdits(x, commit) {
    icBody.querySelectorAll("[data-icedit]").forEach(row => row.onclick = () => {
      const k = +row.dataset.icedit, b = x.splits[2 * k], j = x.splits[2 * k + 1];
      sheet.innerHTML = `<div class="sheet-card"><div class="sheet-title">Round ${k + 1}</div>
        <div class="phase-lbl small" style="text-align:left">Seconds to finish the reps. Leave blank if you didn't finish within the minute.</div>
        <label class="edrow"><span>Burpees ×${IC.ex[0].reps} (minute ${2 * k + 1})</span><input class="numin sm" id="edB" type="number" inputmode="numeric" min="1" max="60" value="${secs(b) ?? ""}"></label>
        ${2 * k + 1 < x.minsDone ? `<label class="edrow"><span>Box jumps ×${IC.ex[1].reps} (minute ${2 * k + 2})</span><input class="numin sm" id="edJ" type="number" inputmode="numeric" min="1" max="60" value="${secs(j) ?? ""}"></label>` : ""}
        <div class="row2"><button class="bigbtn alt" id="edCancel" style="flex:1">Cancel</button><button class="bigbtn" id="edSave" style="flex:2;font-size:26px;padding:14px">Save</button></div></div>`;
      sheet.classList.add("show");
      document.getElementById("edCancel").onclick = () => sheet.classList.remove("show");
      document.getElementById("edSave").onclick = () => {
        const v = id => { const n = numOf(id); return n == null || n === 0 ? null : Math.min(60, n) * 1000; };
        x.splits[2 * k] = v("edB"); if (document.getElementById("edJ")) x.splits[2 * k + 1] = v("edJ");
        sheet.classList.remove("show"); commit();
      };
    });
  }

  function buildIc() {
    if (ic.phase === "setup") {
      if (icOpen && hist[icOpen]) {                         // a past session
        const x = hist[icOpen];
        icBody.innerHTML = `<div class="exname" style="font-size:32px">${dstr(x.start)}</div>${icSummary(x, true)}
          <div class="row2 actbar"><button class="bigbtn alt" id="icBack" style="flex:2">‹ All sessions</button><button class="bigbtn alt" id="icDel" style="flex:1">Delete</button></div>`;
        icWireEdits(x, () => { putSession(x); icView = ""; renderIc(); });
        document.getElementById("icBack").onclick = () => { icOpen = null; icView = ""; renderIc(); window.scrollTo(0, 0); };
        let armed = null; const del = document.getElementById("icDel");
        del.onclick = () => { if (!armed) { del.textContent = "Tap again"; del.style.color = "var(--warn)"; armed = setTimeout(() => { armed = null; del.textContent = "Delete"; del.style.color = ""; }, 3000); return; }
          clearTimeout(armed); dropSession(x.id); icOpen = null; icView = ""; renderIc(); };
        return;
      }
      const past = Object.values(hist).filter(x => x.kind === IC.kind).sort((p, q) => q.start - p.start);
      icBody.innerHTML = `<div class="exname" style="margin-top:8px">${IC.name}</div>
        <div class="card tight">
          <div class="stat"><span>Odd minutes (1, 3, 5…)</span><b>Burpees ×${IC.ex[0].reps}</b></div>
          <div class="stat"><span>Even minutes (2, 4, 6…)</span><b>Box jumps ×${IC.ex[1].reps}</b></div>
          <div class="stat"><span>Duration</span><b>20 min</b></div></div>
        <div class="phase-lbl small">Tap Done as soon as you finish the reps. Rest the balance of the minute.</div>
        ${past.length ? `<div class="hist"><div class="hrow h ic3"><span>Past</span><span>Done</span><span>Avg B / J</span></div>
          ${past.map(x => { const st = icStats(x); return `<div class="hrow ic3 tap" data-icopen="${x.id}"><span>${new Date(x.start).getMonth() + 1}/${new Date(x.start).getDate()}</span><span>${st.done}/${st.n}</span><span>${st.bAvg ?? "–"}s / ${st.jAvg ?? "–"}s</span></div>`; }).join("")}</div>` : ""}
        <div style="flex:1"></div>
        <div class="row2 actbar"><button class="bigbtn" id="icGo" style="flex:1">Start · 20 min</button></div>`;
      icBody.querySelectorAll("[data-icopen]").forEach(r => r.onclick = () => { icOpen = r.dataset.icopen; icView = ""; renderIc(); window.scrollTo(0, 0); });
      document.getElementById("icGo").onclick = () => { unlockAudio(); wake(true);
        const st = Date.now() + 3000; icLastMin = null; icLastBeep = null;
        icSet({ phase: "run", start: st, end: null, splits: [], minsDone: 0, id: IC.kind + "-" + st }); };
    } else if (ic.phase === "run") {
      icBody.innerHTML = `<div class="phase-lbl" id="icMinLbl"></div>
        <div class="icpips" id="icPips">${Array.from({ length: IC.mins }, () => "<div></div>").join("")}</div>
        <div class="exname" id="icEx" style="margin-top:14px"></div>
        <div class="phase-lbl" id="icReps"></div>
        <div class="work" id="icClock"></div>
        <div class="icrest" id="icRest"></div>
        <div style="flex:1"></div>
        <div class="row2 actbar"><button class="bigbtn alt" id="icUndo" style="flex:1">Undo</button>
          <button class="bigbtn" id="icDone" style="flex:3;padding:40px 10px">Done ✓</button></div>
        <button class="ghost" id="icEnd" style="align-self:center">End early</button>`;
      document.getElementById("icDone").onclick = () => { const m = icMin(); if (m < 0 || m >= IC.mins || ic.splits[m] != null) return;
        const sp = ic.splits.slice(); sp[m] = Date.now() - (ic.start + m * 60000); beep(990, 0.1); buzz([40, 40, 40]); ic.splits = sp; saveIc(); renderIc(); };
      document.getElementById("icUndo").onclick = () => { const m = icMin(); if (m < 0 || ic.splits[m] == null) return;

      let armed = null; const end = document.getElementById("icEnd");
