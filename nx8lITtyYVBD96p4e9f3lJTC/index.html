        <div class="row2 actbar"><button class="bigbtn ${paused ? "" : "alt"}" id="abPause" style="flex:2">${paused ? "Resume" : "Pause"}</button>
          <button class="bigbtn alt" id="abEnd" style="flex:1">End</button></div>`;
      document.getElementById("abPause").onclick = () => { unlockAudio(); if (ab.t.startedAt) { pauseT(ab.t); wake(false); } else { startT(ab.t); wake(true); } saveAb(); abView = ""; renderAb(); };
      let armed = null; const end = document.getElementById("abEnd");
      end.onclick = () => { if (!armed) { end.textContent = "Tap again"; end.classList.add("confirm"); armed = setTimeout(() => { armed = null; end.textContent = "End"; end.classList.remove("confirm"); }, 3000); return; }
        clearTimeout(armed); abFinish(true); };
    } else {
      abBody.innerHTML = `<div class="exname" style="margin-top:4px">${AB.name} done</div>
        <div class="card tight"><div class="stat"><span>Moves completed</span><b>${ab.done} / ${AB.ex.length}</b></div>
          <div class="stat"><span>Time</span><b>${fmt(ab.end - ab.start)}</b></div></div>
        <div style="flex:1"></div>
        <div class="row2 actbar"><button class="bigbtn alt" id="abPast" style="flex:1">Past sessions</button></div>`;
      document.getElementById("abPast").onclick = () => { ab.phase = "setup"; saveAb(); abView = ""; renderAb(); window.scrollTo(0, 0); };
    }
  }
  function renderAb() {
    const ms = ab.phase === "run" ? elapsedOf(ab.t) : 0;
    if (ab.phase === "run" && ms >= AB_TOTAL) { abFinish(false); return; }
    const seg = ab.phase === "run" && ms >= 0 ? Math.floor(ms / AB.work) : -1;
    const key = ab.phase + "|" + seg + "|" + !!ab.t.startedAt;
    if (key !== abView) { abView = key; buildAb(seg); }
    document.getElementById("abTotal").textContent = ab.phase === "run" ? fmt(Math.max(0, ms)) : ab.phase === "done" && ab.end ? fmt(ab.end - ab.start) : "0:00";
    if (ab.phase !== "run") return;
    const clock = document.getElementById("abClock"), cue = document.getElementById("abCue");
    if (ms < 0) {
      const pre = Math.ceil(-ms / 1000);
      document.getElementById("abLbl").textContent = "Move 1 of 11";
      document.getElementById("abEx").textContent = AB.ex[0];
      cue.textContent = "Get in position"; cue.classList.add("pre"); clock.textContent = pre; clock.classList.add("pre");
      if (ab.t.startedAt && pre !== abLastBeep) { beep(660, 0.12); buzz(40); abLastBeep = pre; }
      return;
    }
    const left = Math.ceil((AB.work * (seg + 1) - ms) / 1000);
    if (seg !== abLastSeg) { if (ab.t.startedAt) { beep(1320, 0.35); buzz(150); } abLastSeg = seg; abLastBeep = null; }
    document.getElementById("abLbl").textContent = `Move ${seg + 1} of 11`;
    document.getElementById("abEx").textContent = AB.ex[seg];
    cue.classList.remove("pre"); cue.textContent = ab.t.startedAt ? "Go" : "Paused";
    clock.classList.remove("pre"); clock.textContent = left; clock.classList.toggle("hot", left <= 5);
    document.getElementById("abNext").textContent = AB.ex[seg + 1] ? `Next: ${AB.ex[seg + 1]}` : "Last one — finish strong";
    [...document.getElementById("abPips").children].forEach((d, i) => { d.classList.toggle("on", i < seg); d.classList.toggle("cur", i === seg); });
    if (ab.t.startedAt && left <= 3 && left > 0 && left !== abLastBeep) { beep(880, 0.12); abLastBeep = left; }
  }

  /* ---------- Home + loop ---------- */
  const todaysSession = kind => Object.values(hist).filter(x => x.kind === kind && new Date(x.start).toDateString() === today).sort((p, q) => q.start - p.start)[0];
  function renderHome() {
    const t = total4();
    document.getElementById("st400").textContent =
      t === 400 ? `Done today in ${fmt(elapsedOf(c4.sw))}` : (t || c4.sw.acc || c4.sw.startedAt) ? `In progress: ${t}/400, ${fmt(elapsedOf(c4.sw))}` : "";
    const ms = elapsedOf(p1.t);
    document.getElementById("stPlus").textContent =
      (p1.count || ms) ? `In progress: ${p1.count} rounds, ${fmt(ms)}` : "";
    for (const v of Object.keys(PHV)) {
      const st = v === phV ? ph : loadPh(v);
      document.getElementById("stPhat" + v).textContent = st.phase === "done" ? (PHV[v].fixed ? `✓ ${st.rounds.length}/${PHV[v].rounds}` : `✓ ${sumR(st.rounds.map(rTot))} reps`) :
        st.start ? `R${st.rounds.length + 1} · ${fmt(Date.now() - st.start)}` : "";
    }
    for (const v of Object.keys(ICV)) {
      const st = v === icV ? ic : load(ICV[v].key, icFresh()), last = todaysSession(ICV[v].kind);
      document.getElementById("stIc" + v).textContent = st.phase === "run" && st.start ? `Min ${Math.min(20, Math.max(1, Math.floor((Date.now() - st.start) / 60000) + 1))}/20` :
        last ? `✓ ${icStats(last).done}/${icStats(last).n} min` : "";
    }
    const lastAb = todaysSession(AB.kind);
    document.getElementById("stAbs").textContent = ab.phase === "run" ? fmt(Math.max(0, elapsedOf(ab.t))) : lastAb ? `✓ ${lastAb.done}/11` : "";
    for (const v of Object.keys(C4V)) {
      const st = v === c4V ? ct : load(C4V[v].key, c4Fresh()), last4 = todaysSession(C4V[v].kind);
      document.getElementById("stIc4" + v).textContent = st.phase === "run" ? `${st.t.startedAt ? "" : "Paused · "}${fmt(Math.max(0, elapsedOf(st.t)))}` :
        last4 ? `✓ ${last4.roundsDone}/${C4V[v].rounds}` : "";
    }
    const ms12 = elapsedOf(r12.t);
    document.getElementById("st12").textContent = r12.done ? `Done today in ${fmtT(ms12)}` :
      ms12 ? `In progress: ${r12.splits.length}/12, ${fmt(ms12)}` : "";
  }
  function renderAll() { render400(); renderPlus(); render12(); renderPh(); renderHist(); renderIc(); renderC4(); renderAb(); renderHome(); }

  function tick() {
    document.getElementById("sw").textContent = fmt(elapsedOf(c4.sw));
    renderPlus();
    render12();
    renderPh();
    renderIc();
    renderC4();
    renderAb();
    if (document.getElementById("home").classList.contains("active")) renderHome();
  }
  setInterval(tick, 200);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (c4.sw.startedAt || p1.t.startedAt || r12.t.startedAt || ic.phase === "run" || (ct.phase === "run" && ct.t.startedAt) || (ab.phase === "run" && ab.t.startedAt) || (ph.start && ph.phase !== "done"))) wake(true); });

  let startScreen = "home";
  try { startScreen = localStorage.getItem("wkScreen") || "home"; } catch (e) {}
  show(document.getElementById(startScreen) ? startScreen : "home");
  tick();
</script>
</body>
</html>
